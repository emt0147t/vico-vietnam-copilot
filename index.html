    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,800&display=swap');
      
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        letter-spacing: -0.01em;
      }
      
      h1, h2, h3, .font-black {
        letter-spacing: -0.03em;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.5);
        border-radius: 20px;
      }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(75, 85, 99, 0.5);
      }
      
      .perspective-2000 {
        perspective: 2000px;
      }
      
      .rotate-x-12 {
        transform: rotateX(12deg);
      }
      
      /* Loading bar animation */
      @keyframes loading-bar {
        0% { width: 0%; }
        30% { width: 40%; }
        60% { width: 70%; }
        100% { width: 100%; }
      }
      
      .animate-loading-bar {
        animation: loading-bar 2.2s ease-out forwards;
      }
      
      /* Fade in animation */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
        opacity: 0;
      }

      /* Slide up animation */
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-slide-up {
        animation: slide-up 0.4s ease-out forwards;
        opacity: 0;
      }

      /* Slide down animation */
      @keyframes slide-down {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-slide-down {
        animation: slide-down 0.3s ease-out forwards;
        opacity: 0;
      }

      /* Toast animation */
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(16px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      
      .animate-toast-in {
        animation: toast-in 0.35s ease-out forwards;
      }

      /* Focus visible styles for accessibility */
      *:focus-visible {
        outline: 2px solid #B91C1C;
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
