
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VICO - Vietnam Copilot: Nền tảng trí tuệ thị trường Việt Nam. Thu thập, phân tích và trực quan hóa dữ liệu thị trường trong tích tắc." />
    <meta name="theme-color" content="#B91C1C" />
    <meta property="og:title" content="VICO - Vietnam Market Intelligence Copilot" />
    <meta property="og:description" content="Thu thập, phân tích và trực quan hóa dữ liệu thị trường Việt Nam trong tích tắc." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>VICO - Vietnam Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              body: ['"Manrope"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              sans: ['"Plus Jakarta Sans"', '"Manrope"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              // --- VICO Executive Crimson Palette ---
              surface: {
                base: '#FAFAFA',
                card: '#FFFFFF',
                border: '#E4E4E7',
              },
              ink: {
                primary: '#18181B',
                muted: '#71717A',
                faint: '#A1A1AA',
              },
              brand: {
                DEFAULT: '#E11D48',
                hover: '#BE123C',
                light: '#FFF1F2',
                subtle: '#FFE4E6',
              },
              ai: {
                rose: '#E11D48',
                sunset: '#F97316',
                glow: '#FFF7ED',
              },
              status: {
                growth: '#059669',
                'growth-bg': '#D1FAE5',
                warn: '#D97706',
                'warn-bg': '#FEF3C7',
                decline: '#991B1B',
                'decline-bg': '#F5F5F4',
              },
              // Legacy compat
              gray: { 950: '#0B101B' },
              vico: { red: '#E11D48', coral: '#FB7185', dark: '#0B101B', panel: '#0F1623' },
            },
            borderRadius: {
              bento: '12px',
            },
            boxShadow: {
              bento: '0 1px 3px 0 rgba(0,0,0,0.04)',
              'bento-hover': '0 4px 12px 0 rgba(0,0,0,0.06)',
              glow: '0 0 20px 4px rgba(225,29,72,0.10)',
            },
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,800&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
      
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        letter-spacing: -0.01em;
      }
      
      h1, h2, h3, .font-black {
        letter-spacing: -0.03em;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.5);
        border-radius: 20px;
      }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(75, 85, 99, 0.5);
      }
      
      .perspective-2000 {
        perspective: 2000px;
      }
      
      .rotate-x-12 {
        transform: rotateX(12deg);
      }
      
      /* Loading bar animation */
      @keyframes loading-bar {
        0% { width: 0%; }
        30% { width: 40%; }
        60% { width: 70%; }
        100% { width: 100%; }
      }
      
      .animate-loading-bar {
        animation: loading-bar 2.2s ease-out forwards;
      }
      
      /* Fade in animation */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
        opacity: 0;
      }

      /* Slide up animation */
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-slide-up {
        animation: slide-up 0.4s ease-out forwards;
        opacity: 0;
      }

      /* Slide down animation */
      @keyframes slide-down {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-slide-down {
        animation: slide-down 0.3s ease-out forwards;
        opacity: 0;
      }

      /* Toast animation */
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(16px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      
      .animate-toast-in {
        animation: toast-in 0.35s ease-out forwards;
      }

      /* Focus visible styles for accessibility */
      *:focus-visible {
        outline: 2px solid #E11D48;
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#FAFAFA] text-[#18181B] dark:bg-[#0B101B] dark:text-white transition-colors duration-200 antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
