# ============================================
# Railway.app - VICO Market Intelligence
# Auto-deploy khi push code lên GitHub
# ============================================

[build]
builder = "NIXPACKS"
buildCommand = "npm install --legacy-peer-deps && npx prisma generate 2>/dev/null; npm run build"

[deploy]
startCommand = "SKIP_VECTOR_SEEDING=true npx tsx server.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
